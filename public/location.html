<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Location – QR Empire</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <style>
    :root { --bg: #1c2027; --panel: #262b34; --line: #343b47; --text: #e9e6df; --muted: #9aa0aa; --gold: #ffd66b; --ok: #7fd17f; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    #app { display: flex; height: 100%; }
    #viewport { flex: 1; min-width: 0; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
    #viewport:active { cursor: grabbing; }
    #fps { position: absolute; left: 12px; top: 10px; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; opacity: .85; }
    select { background: #1c2027; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
    /* build bar: building icons over the map; hover card; placement hint */
    #buildbar { position: absolute; left: 12px; bottom: 34px; display: flex; gap: 6px; padding: 6px; background: rgba(28, 32, 39, .82); border: 1px solid var(--line); border-radius: 10px; }
    .bb { width: 46px; height: 46px; font-size: 24px; border-radius: 8px; border: 1px solid #4a5465; background: #3b4352; cursor: pointer; padding: 0; }
    .bb:hover { background: #4a5465; border-color: var(--gold); }
    .bb.off { opacity: .45; }
    #buildtip { position: fixed; transform: translateY(-100%); max-width: 240px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; pointer-events: none; display: none; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
    #buildtip.show { display: block; }
    #buildhint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 5px 12px; background: rgba(28, 32, 39, .85); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; display: none; pointer-events: none; }
    #buildhint.show { display: block; }
    #help { position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; opacity: .85; }
    #side { width: 340px; flex-shrink: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px 24px; box-sizing: border-box; font-size: 14px; }
    @media (max-width: 760px) {
      #app { flex-direction: column; }
      #viewport { height: 55vh; flex: none; width: 100%; }
      #side { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
      #help { display: none; } /* keyboard/mouse hints: irrelevant on phones, and would overlap the sidebar */
      #buildbar { bottom: auto; top: calc(55vh - 70px); }
      #buildhint { left: 50%; top: 8px; }
    }
    h1 { font-size: 20px; margin: 8px 0 2px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
    .stars { color: var(--gold); font-size: 16px; }
    .traits { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .trait { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #323946; color: #c9cdd4; border: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .ok { color: var(--ok); }
    .row { margin-top: 8px; }
    .back { color: var(--muted); text-decoration: none; font-size: 13px; }
    .back:hover { color: var(--text); }
    .switcher { display: flex; gap: 4px; margin-top: 8px; }
    .switcher select { flex: 1; min-width: 0; }
    input { background: #1c2027; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; width: 110px; }
    .btn { background: #3b4352; color: var(--text); border: 1px solid #4a5465; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: #4a5465; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .stock div { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
    .stock .rate { margin-left: auto; color: var(--ok); font-size: 12px; }
    .cards { display: flex; flex-direction: column; gap: 8px; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: #222730; }
    .card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
    .card-head { display: flex; align-items: center; gap: 8px; }
    .card-head .muted { margin-left: auto; font-size: 12px; text-align: right; }
    .icon { font-size: 22px; }
    .action { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .reason { color: #d9a25f; margin-top: 2px; text-align: right; }
    .msg { margin-top: 14px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewport"></canvas>
    <div id="fps"></div>
    <div id="buildbar"></div>
    <div id="buildtip"></div>
    <div id="buildhint"></div>
    <div id="help">WASD / arrows / screen edge: scroll · drag: pan · wheel: zoom · Q/E: rotate · click a building to select</div>
    <aside id="side">loading…</aside>
  </div>
  <script type="module" src="/src/client/location.ts"></script>
</body>
</html>
